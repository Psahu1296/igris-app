# Tag a version (git tag v1.0.1 && git push origin v1.0.1) → signed release APK
# attached to a GitHub Release. Needed whenever native code changes; JS-only
# changes go out over the air instead (ota-update.yml).
name: Android release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Inlined into the JS bundle — URLs only, never secrets.
      EXPO_PUBLIC_MAESTRO_LOCAL_URL: ${{ secrets.EXPO_PUBLIC_MAESTRO_LOCAL_URL }}
      EXPO_PUBLIC_MAESTRO_CLOUD_URL: https://maestro-hvdz.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Restore release keystore
        run: echo "${{ secrets.IGRIS_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/igris-release.jks"

      - name: Build release APK
        working-directory: android
        env:
          IGRIS_KEYSTORE_PATH: ${{ runner.temp }}/igris-release.jks
          IGRIS_KEYSTORE_PASSWORD: ${{ secrets.IGRIS_KEYSTORE_PASSWORD }}
          IGRIS_KEY_ALIAS: igris # not secret; as a secret it masked every "igris" in the logs
          IGRIS_KEY_PASSWORD: ${{ secrets.IGRIS_KEY_PASSWORD }}
        # arm64 only: every phone we target, and half the build time and APK size.
        run: ./gradlew assembleRelease -PigrisVersionCode=${{ github.run_number }} -PreactNativeArchitectures=arm64-v8a --no-daemon

      # Kept as a run artifact too, so a built APK is never lost to a failed release step.
      - uses: actions/upload-artifact@v4
        with:
          name: igris-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp android/app/build/outputs/apk/release/app-release.apk "igris-${TAG}.apk"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$TAG" "igris-${TAG}.apk" --verify-tag --title "Igris $TAG" --generate-notes
          else
            gh release create "build-${{ github.run_number }}" "igris-${TAG}.apk" --target "$GITHUB_SHA" --title "Igris build ${{ github.run_number }}" --prerelease
          fi
